# Build with Hugo and deploy to GitHub Pages.
# Only official GitHub Actions are used; Hugo is installed from a pinned official release.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.170.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo (pinned official release)
        shell: bash
        run: |
          set -euo pipefail

          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          checksums="hugo_${HUGO_VERSION}_checksums.txt"
          release_url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"

          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "${release_url}/${archive}"
          curl -fsSL -o "${RUNNER_TEMP}/${checksums}" "${release_url}/${checksums}"
          (
            cd "${RUNNER_TEMP}"
            awk -v file="${archive}" '$2 == file' "${checksums}" | sha256sum -c -
          )

          mkdir -p "${HOME}/.local/hugo"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${HOME}/.local/hugo" hugo
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
          "${HOME}/.local/hugo/hugo" version

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --minify --gc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
